# Configuración base (apta para producción).
# NO publica puertos al host: la app queda accesible solo dentro de la red
# interna de Docker (servicio "web" en el puerto 3000). Se expone públicamente
# mediante Cloudflare Tunnel (cloudflared), no abriendo puertos.
#
# Desarrollo local: `docker compose up` aplica además docker-compose.override.yml,
# que publica el puerto para poder abrir http://localhost:8080.
#
# Producción: `docker compose -f docker-compose.yml up -d` (lo hace prod.sh),
# que ignora el override y por lo tanto no publica ningún puerto.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-figus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-figus}
      POSTGRES_DB: ${POSTGRES_DB:-figus}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-figus} -d ${POSTGRES_DB:-figus}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-figus}:${POSTGRES_PASSWORD:-figus}@db:5432/${POSTGRES_DB:-figus}
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  # Túnel de Cloudflare (opcional). Se activa solo con el perfil "tunnel".
  # Conecta el túnel directo a web:3000 por la red interna, sin publicar puertos.
  #
  # Modo por defecto (archivo de config): definí el endpoint en
  #   cloudflared/config.yml  (ingress -> http://web:3000). Ver config.yml.example.
  #
  # Modo por token: seteá TUNNEL_TOKEN en .env y CLOUDFLARED_ARGS en .env con
  #   CLOUDFLARED_ARGS=tunnel --no-autoupdate run
  #   (en este modo el endpoint se define en el panel de Cloudflare -> http://web:3000).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ${CLOUDFLARED_ARGS:-tunnel --no-autoupdate --config /etc/cloudflared/config.yml run}
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - web

volumes:
  db-data:
