services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-figus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-figus}
      POSTGRES_DB: ${POSTGRES_DB:-figus}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-figus} -d ${POSTGRES_DB:-figus}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Descomentá si querés conectarte a la BD desde tu máquina:
    # ports:
    #   - "5432:5432"

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-figus}:${POSTGRES_PASSWORD:-figus}@db:5432/${POSTGRES_DB:-figus}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:3000"

volumes:
  db-data:
